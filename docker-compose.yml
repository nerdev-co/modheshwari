services:
    # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: modheshwari-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-changeme}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-changeme}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Zookeeper (for Kafka) - optional, skip on small VMs
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: modheshwari-zookeeper
    restart: unless-stopped
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-logs:/var/lib/zookeeper/log

  # Kafka - optional, skip on small VMs
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: modheshwari-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka-data:/var/lib/kafka/data

  # Backend API - Elysia + Bun
  be:
    image: ghcr.io/nerdev-co/modheshwari-be:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
      target: runner-be
    container_name: modheshwari-be
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-changeme}@redis:6379
      - KAFKA_BROKER=kafka:9092
      - NODE_ENV=production
      - PORT=3001
    ports:
      - "3001:3001"
    working_dir: /app
    command: ["bun", "run", "apps/be/index.ts"]
    healthcheck:
      test: ["CMD-SHELL", "bun -e \"try { const r = await fetch('http://localhost:3001/api/health'); process.exit(r.ok ? 0 : 1) } catch { process.exit(1) }\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    depends_on:
      redis:
        condition: service_healthy

  # Frontend - Next.js
  web:
    image: ghcr.io/nerdev-co/modheshwari-web:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
      target: runner-web
    container_name: modheshwari-web
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - API_BACKEND_URL=http://be:3001
      - NODE_ENV=production
      - PORT=3000
    expose:
      - "3000"
    working_dir: /app/apps/web
    command: ["bun", "run", "start"]
    healthcheck:
      test: ["CMD-SHELL", "bun -e \"try { const r = await fetch('http://localhost:3000'); process.exit(r.ok ? 0 : 1) } catch { process.exit(1) }\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      be:
        condition: service_healthy

  # WebSocket Server - Bun + ws
  ws:
    image: ghcr.io/nerdev-co/modheshwari-ws:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
      target: runner-ws
    container_name: modheshwari-ws
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://:${REDIS_PASSWORD:-changeme}@redis:6379
      - KAFKA_BROKER=kafka:9092
      - NODE_ENV=production
      - PORT=3002
    expose:
      - "3002"
    working_dir: /app
    command: ["bun", "run", "apps/ws/index.ts"]
    healthcheck:
      test: ["CMD-SHELL", "bun -e \"try { const r = await fetch('http://localhost:3002/health'); process.exit(r.ok ? 0 : 1) } catch { process.exit(1) }\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_started

  # Reverse proxy - single entry point for all traffic
  nginx:
    image: nginx:alpine
    container_name: modheshwari-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
      - be
      - ws

volumes:
  redis-data:
  zookeeper-data:
  zookeeper-logs:
  kafka-data:
